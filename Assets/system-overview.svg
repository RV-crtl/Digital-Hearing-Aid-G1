<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Digital Hearing Aid engineering architecture. Bluetooth and telecoil feed DMA capture, the FreeRTOS AudioTask processes source selection, DSP profiles and overload guardian, and SAI output drives the transducer. Optional microphone and TinyML are not yet integrated.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081625"/><stop offset="1" stop-color="#13283e"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#115e83"/><stop offset="1" stop-color="#164e63"/></linearGradient>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7eadd3"/></marker>
  <style>.tit{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f7ff}.sub{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#a8c4d8}.box{fill:#112e46;stroke:#3b6581;stroke-width:1.5}.t{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f7fbff}.d{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bed8e8}.arrow{fill:none;stroke:#7eadd3;stroke-width:2.5;marker-end:url(#arrow)}.future{fill:#213047;stroke:#8294a7;stroke-width:1.5;stroke-dasharray:8 5}.f{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bdc4ce}</style>
</defs>
<rect width="1200" height="430" rx="20" fill="url(#bg)"/>
<text x="45" y="49" class="tit">Digital Hearing Aid · Embedded Architecture</text>
<text x="45" y="76" class="sub">STM32L476RG  ·  FreeRTOS  ·  48 kHz PCM  ·  hardware-independent tests + board validation gates</text>
<rect x="48" y="111" width="199" height="82" rx="12" class="box"/>
<rect x="48" y="219" width="199" height="82" rx="12" class="box"/>
<text x="65" y="142" class="t">Bluetooth ADC</text><text x="65" y="166" class="d">SAI1A · RX DMA</text>
<text x="65" y="250" class="t">Telecoil ADC</text><text x="65" y="274" class="d">SAI2A · RX DMA</text>
<path class="arrow" d="M247 153H302V194H342"/><path class="arrow" d="M247 259H302V222H342"/>
<rect x="342" y="150" width="212" height="115" rx="14" fill="url(#blue)" stroke="#4681a9" stroke-width="1.5"/>
<text x="362" y="184" class="t">Capture queues</text><text x="362" y="208" class="d">Bounded PCM blocks</text><text x="362" y="231" class="d">Source validity + routing</text>
<path class="arrow" d="M554 207H605"/>
<rect x="605" y="134" width="264" height="146" rx="15" fill="url(#mint)" stroke="#58b8ae" stroke-width="1.5"/>
<text x="625" y="170" class="t">AudioTask · Priority 7</text><text x="625" y="195" class="d">DSP filters + optional profiles</text><text x="625" y="219" class="d">Gain ramps · source FSM</text><text x="625" y="243" class="d">Overload guardian fallback</text>
<path class="arrow" d="M869 207H928"/>
<rect x="928" y="150" width="222" height="115" rx="14" class="box"/>
<text x="948" y="183" class="t">Bone-conduction</text><text x="948" y="207" class="d">SAI2B · TX DMA</text><text x="948" y="231" class="d">Amplifier + transducer</text>
<rect x="342" y="306" width="527" height="65" rx="10" fill="#102438" stroke="#385570"/>
<text x="363" y="331" class="t">FreeRTOS control plane</text>
<text x="363" y="354" class="d">Control queue · UART / BT supervision · task runtime metrics · user input</text>
<path d="M735 280V304" stroke="#7eadd3" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="48" y="337" width="199" height="62" rx="10" class="future"/>
<text x="65" y="362" class="t" font-size="14">PDM Mic + TinyML</text><text x="65" y="382" class="f">Planned · not integrated</text>
<rect x="928" y="312" width="222" height="60" rx="10" class="future"/>
<text x="947" y="337" class="t">Custom PCB / USB-C</text><text x="947" y="355" class="f">Requires electrical validation</text>
<text x="50" y="419" class="sub">Solid = current software path  ·  Dashed = integration / validation pending  ·  Not medical certified</text>
</svg>
