name: Engineering CI — DSP, RTOS and standalone UI
on:
  push:
    branches: [main, 'improve/**', 'feature/**', 'validation/**', 'fix/**', 'assessment/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-verification:
    name: Portable C + independent analysis (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Record compiler and Python environment
        run: |
          "$CC" --version | head -1
          python3 --version
      - name: Audit bidirectional requirements/test coverage (with mutation tests)
        run: |
          python3 Assessment/validate_pack.py
          python3 Assessment/test_validate_pack.py
      - name: Preflight source, recovery and build dependencies
        run: python3 Tools/g1_preflight.py
      - name: Verify actual production source and numerical evidence
        run: python3 Validation/run_host_validation.py
      - name: Upload host-only vectors, analysis and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-evidence-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            Validation/results/audio_vectors.csv
            Validation/results/profile_host_benchmark.csv
            Validation/results/kicad_audit.json
          if-no-files-found: warn
          retention-days: 30
  sanitizer:
    name: DSP and Guardian AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile & run portable modules with sanitizers
        run: |
          set -eu
          mkdir -p /tmp/dha-sanitize
          CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Werror -fno-omit-frame-pointer -fsanitize=address,undefined -I Core/Inc'
          gcc $CFLAGS Tests/test_group_features.c Core/Src/group_features.c -o /tmp/dha-sanitize/profiles
          gcc $CFLAGS Tests/test_group_guardian.c Core/Src/group_guardian.c -o /tmp/dha-sanitize/guardian
          gcc $CFLAGS Tests/test_group_ui.c Core/Src/group_ui.c -o /tmp/dha-sanitize/ui
          /tmp/dha-sanitize/profiles
          /tmp/dha-sanitize/guardian
          /tmp/dha-sanitize/ui
