name: Engineering CI — DSP, RTOS and standalone UI
on:
  push:
    branches: [main, 'improve/**', 'feature/**', 'validation/**', 'fix/**', 'assessment/**']
  pull_request:
  workflow_dispatch:
# New commits supersede obsolete builds for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  c-verification:
    name: Portable C + independent analysis (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Record compiler and Python environment
        run: |
          "$CC" --version | head -1
          python3 --version
      - name: Audit bidirectional requirements/test coverage (with mutation tests)
        run: |
          python3 Assessment/validate_pack.py
          python3 Assessment/test_validate_pack.py
          python3 Assessment/test_evidence_audit.py
          python3 Assessment/evidence_audit.py
      - name: Preserve existing G6 rubric and full host validation gates
        run: |
          python3 Validation/python/check_hd_coverage.py
          bash Validation/run_host_validation.sh
      - name: Preflight source, recovery and build dependencies
        run: python3 Tools/g1_preflight.py
      - name: Verify actual production source and numerical evidence
        run: python3 Validation/run_host_validation.py
      - name: Upload host-only vectors, analysis and benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-evidence-${{ matrix.compiler }}-${{ github.sha }}
          path: |
            Validation/results/audio_vectors.csv
            Validation/results/profile_host_benchmark.csv
            Validation/results/kicad_audit.json
          if-no-files-found: warn
          retention-days: 30
  sanitizer:
    name: DSP and Guardian AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile & run portable modules with sanitizers
        run: |
          set -eu
          mkdir -p /tmp/dha-sanitize
          CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Werror -fno-omit-frame-pointer -fsanitize=address,undefined -I Core/Inc'
          gcc $CFLAGS Tests/test_group_features.c Core/Src/group_features.c -o /tmp/dha-sanitize/profiles
          gcc $CFLAGS Tests/test_group_guardian.c Core/Src/group_guardian.c -o /tmp/dha-sanitize/guardian
          gcc $CFLAGS Tests/test_group_ui.c Core/Src/group_ui.c -o /tmp/dha-sanitize/ui
          gcc $CFLAGS Tests/test_control_protocol.c Core/Src/control_protocol.c -o /tmp/dha-sanitize/protocol
          gcc $CFLAGS Tests/test_pcm_transport.c Core/Src/pcm_transport.c Core/Src/audio_processing.c -o /tmp/dha-sanitize/pcm
          /tmp/dha-sanitize/profiles
          /tmp/dha-sanitize/guardian
          /tmp/dha-sanitize/ui
          /tmp/dha-sanitize/protocol
          /tmp/dha-sanitize/pcm
  windows-bundle-smoke:
    name: One-command Windows evidence runner (source mode only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PowerShell runner and integrity of structured evidence archive
        shell: pwsh
        run: |
          ./G1_RUN_ALL.ps1 -SkipPortableTests -SkipPdf
          $archive = Get-ChildItem -Path . -Filter 'G1_QUALITY_EVIDENCE_*.zip' -File |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $archive -or $archive.Length -le 200) {
            throw 'Evidence ZIP missing or too small.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            if(-not ($zip.Entries.FullName -contains 'G1_BUNDLE_MANIFEST.json')) {
              throw 'Missing evidence hash manifest.'
            }
          } finally { $zip.Dispose() }
