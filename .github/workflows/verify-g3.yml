name: G3 production-C verification and analysis
on:
  push:
    branches: [main, 'improve/**', 'feature/**', 'validation/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-and-analysis:
    name: Production C host tests and verification vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          gcc --version | head -1
          python3 --version
      - name: Run actual production-C filter / FSM / RTOS-source / KiCad dependency audits
        run: bash Validation/run_host_validation.sh
      - name: Export numerical evidence (NOT an on-board validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-host-evidence-${{ github.sha }}
          path: |
            Validation/results/audio_vectors.csv
            Validation/results/kicad_audit.json
          if-no-files-found: warn
          retention-days: 14
