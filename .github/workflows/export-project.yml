name: Export INTERNAL CubeIDE source ZIP (not cleared for public release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unauthorised public export of coursework/group/IP assets
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Repository is public; group/IP clearance for full-tree ZIP has not been established."
            exit 1
          fi
      - name: Test host code before packaging
        run: bash Validation/run_host_validation.sh
      - name: Archive current commit's tracked files only
        run: |
          mkdir -p output
          git archive --format=zip --prefix=Digital-Hearing-Aid/ HEAD > output/Digital-Hearing-Aid-CubeIDE-${GITHUB_SHA:0:8}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cubeide-import-source
          path: output/*.zip
          retention-days: 14
