name: G2 portable regression checks
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run source / recovery validators
        run: |
          python3 CHECK_PROJECT.py
          python3 CHECK_GROUP.py
      - name: Build and test portable DSP and guardian logic
        run: |
          set -eu
          mkdir -p /tmp/g2-bin
          CFLAGS='-std=c11 -O2 -Wall -Wextra -Werror -I Core/Inc'
          gcc $CFLAGS Tests/test_group_features.c Core/Src/group_features.c -o /tmp/g2-bin/profiles
          gcc $CFLAGS Tests/test_encoder.c Core/Src/group_encoder.c -o /tmp/g2-bin/encoder
          gcc $CFLAGS Tests/test_group_guardian.c Core/Src/group_guardian.c -o /tmp/g2-bin/guardian
          /tmp/g2-bin/profiles
          /tmp/g2-bin/encoder
          /tmp/g2-bin/guardian
      - name: Confirm CubeIDE project metadata
        run: |
          test -s .project
          test -s .cproject
          test -s 261013-Individual_Demonstration_Connectivity.ioc
          test -s PREPARE_PROJECT.bat
