name: Publish G1 Interactive Lab (GitHub Pages)

# Manual first deployment: configure Settings > Pages > Source > GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'Documentation/g1-system-2026.dot'
      - 'Hardware/Original_KiCad/**'
      - 'Assessment/test_cases.json'
      - 'Tools/convert_3mf_to_glb.py'
      - '.github/workflows/publish-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: g1-pages-deployment
  cancel-in-progress: false

jobs:
  build-site:
    name: Validate visual website and plot original KiCad sheets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate website routes and actual repository references
        run: python docs/validate_site.py
      - name: Build optimized glTF from original 3MF for GitHub Pages
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1 lxml==6.1.1
          python Tools/convert_3mf_to_glb.py docs/assets/g1-assembly.3mf docs/assets/g1-assembly.glb
          python - <<'PY'
          from pathlib import Path
          original=Path('docs/assets/g1-assembly.3mf')
          published=Path('docs/assets/g1-assembly.glb')
          assert original.is_file(), 'Original 3MF must remain intact'
          assert published.stat().st_size > 1000000, 'Conversion unexpectedly small'
          assert published.open('rb').read(4) == b'glTF', 'Not a valid binary GLB'
          PY
          python docs/validate_site.py
      - name: Check JavaScript module syntax
        run: |
          node --input-type=module --check < docs/app.js
          node --input-type=module --check < docs/viewer.js
          node --input-type=module --check < docs/pcb-explorer.js
          node --check docs/demo-lab.js
      - name: Install KiCad SVG exporter for visualisation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Test native KiCad plot mapping and PCB layer-export commands
        run: |
          python3 docs/test_render_kicad.py
          python3 docs/test_render_pcb.py
      - name: Export hierarchical KiCad original to zoomable SVGs
        run: python docs/render_kicad.py
      - name: Render four read-only original PCB layer views
        run: python docs/render_pcb.py
      - name: Build A3-printable vector system architecture
        run: |
          sudo apt-get install -y --no-install-recommends graphviz
          dot -Tsvg Documentation/g1-system-2026.dot -o docs/plots/g1-system-2026.svg
          test -s docs/plots/g1-system-2026.svg
          python docs/validate_site.py --built
      - name: Confirm only curated site folder is published
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/app.js
          test -s docs/viewer.js
          test -s docs/plots/manifest.json
          test -s docs/plots/pcb/manifest.json
          test -s docs/plots/g1-system-2026.svg
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/plots/manifest.json').read_text())
          print('Native KiCad SVG views:',len(data['schematics']))
          print('Authentic 3MF CAD present:',Path('docs/assets/g1-assembly.3mf').exists())
          assert Path('docs/assets/g1-assembly.3mf').is_file(), 'Source CAD asset missing'
          pcb=json.loads(Path('docs/plots/pcb/manifest.json').read_text())
          assert pcb['view_only'] is True and len(pcb['views'])==4
          assert all((Path('docs')/v['path']).is_file() for v in pcb['views'])
          assert data['view_only'] is True
          names=[item['name'] for item in data['schematics']]
          assert len(names)>=12 and len(names)==len(set(names)), 'KiCad SVG plots incomplete or duplicated'
          PY
      - name: Provide complete downloadable site preview regardless of Pages settings
        uses: actions/upload-artifact@v4
        with:
          name: g1-full-website-preview
          path: docs/
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
  deploy:
    name: Publish website
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
