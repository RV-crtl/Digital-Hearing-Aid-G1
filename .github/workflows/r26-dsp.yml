name: R26 DSP portable correctness
on:
  push:
    paths:
      - "Core/Src/g1_ambient_dsp.c"
      - "Core/Src/g1_scene_ml.c"
      - "Core/Src/tc_cleanup.c"
      - "Core/Inc/g1_ambient_dsp.h"
      - "Core/Inc/g1_scene_ml.h"
      - "Core/Inc/tc_cleanup.h"
      - "Tests/test_r26_dsp.c"
      - "Validation/c/benchmark_r26_dsp.c"
      - ".github/workflows/r26-dsp.yml"
  pull_request:
    paths:
      - "Core/Src/g1_ambient_dsp.c"
      - "Core/Src/g1_scene_ml.c"
      - "Core/Src/tc_cleanup.c"
      - "Core/Inc/g1_ambient_dsp.h"
      - "Core/Inc/g1_scene_ml.h"
      - "Core/Inc/tc_cleanup.h"
      - "Tests/test_r26_dsp.c"
      - ".github/workflows/r26-dsp.yml"
permissions:
  contents: read
jobs:
  bounded-audio-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict portable audio DSP and run sanitizers
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
             -I Core/Inc \
             Tests/test_r26_dsp.c \
             Core/Src/g1_ambient_dsp.c Core/Src/g1_scene_ml.c Core/Src/tc_cleanup.c \
             -lm -o /tmp/r26_dsp_test
          ASAN_OPTIONS=detect_leaks=0 /tmp/r26_dsp_test
      - name: Measure host-only R26 DSP throughput and state progression
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -I Core/Inc              Validation/c/benchmark_r26_dsp.c              Core/Src/g1_ambient_dsp.c Core/Src/g1_scene_ml.c Core/Src/tc_cleanup.c              -lm -o /tmp/g1_r26_host_bench
          /tmp/g1_r26_host_bench
      - name: Verify one active CubeIDE project, not mirrored recovery sources
        run: |
          set -eu
          test ! -e Recovery
          test -f Core/Src/main.c
          test -f 261104-Digital_Hearing_Aid.ioc
          test "$(find Core -name main.c | wc -l)" -eq 1
          test "$(find . -name '*.ioc' | wc -l)" -eq 1
          test -f Core/Src/tc_idle_squelch.c
          test -f Core/Inc/tc_idle_squelch.h
