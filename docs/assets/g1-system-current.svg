</g>
<g><rect x="52" y="161" width="268" height="91" rx="14" fill="#17394d" stroke="#56839a" stroke-opacity=".64"/><text x="72" y="188" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">PDM MICROPHONE</text><text x="72" y="212" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">PC2 clock / PB14 data</text><text x="72" y="232" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Ambient voices + environment</text></g>
<g><rect x="52" y="270" width="268" height="91" rx="14" fill="#17394d" stroke="#56839a" stroke-opacity=".64"/><text x="72" y="297" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">BLUETOOTH</text><text x="72" y="321" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">USART1 status · SAI1A audio</text><text x="72" y="341" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">LOW24 receive PCM</text></g>
<g><rect x="52" y="379" width="268" height="91" rx="14" fill="#17394d" stroke="#56839a" stroke-opacity=".64"/><text x="72" y="406" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">TELECOIL</text><text x="72" y="430" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Analogue loop + PCM1808</text><text x="72" y="450" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">SAI2A · signed LOW16</text></g>
<g><rect x="52" y="500" width="268" height="111" rx="14" fill="#252f50" stroke="#56839a" stroke-opacity=".64"/><text x="72" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">PHYSICAL CONTROLS</text><text x="72" y="551" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">MPR121 E8 / E9 / E10 / E11</text><text x="72" y="571" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Rotary encoder PA0 / PA1</text><text x="72" y="591" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">ControlTask priority 6</text></g>
<g><rect x="397" y="211" width="273" height="148" rx="14" fill="#183947" stroke="#56839a" stroke-opacity=".64"/><text x="417" y="238" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">DMA + RTOS CAPTURE</text><text x="417" y="262" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">DFSDM1 / SAI1A / SAI2A RX</text><text x="417" y="282" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Half / full interrupts</text><text x="417" y="302" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Bounded snapshot → task notify</text></g>
<g><rect x="397" y="500" width="273" height="111" rx="14" fill="#29344f" stroke="#56839a" stroke-opacity=".64"/><text x="417" y="527" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">CONTROL QUEUE</text><text x="417" y="551" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Debounced physical actions</text><text x="417" y="571" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Source / volume / mute events</text><text x="417" y="591" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">BtTask priority 5</text></g>
<g><rect x="741" y="250" width="292" height="214" rx="14" fill="#175447" stroke="#56839a" stroke-opacity=".64"/><text x="761" y="277" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">AUDIOTASK · PRIORITY 7</text><text x="761" y="301" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Source router + PCM decoding</text><text x="761" y="321" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Ambient AGC (R26 candidate)</text><text x="761" y="341" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Telecoil cleanup · FILTER ON</text><text x="761" y="361" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Three unlabelled online clusters</text><text x="761" y="381" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Output FIFO + limiter</text></g>
<g><rect x="1094" y="303" width="250" height="129" rx="14" fill="#4c3830" stroke="#56839a" stroke-opacity=".64"/><text x="1114" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8" fill="#ebfcff">AUDIO OUTPUT</text><text x="1114" y="354" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">SAI2B TX DMA</text><text x="1114" y="374" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Amplifier + speaker</text><text x="1114" y="394" font-family="Arial,sans-serif" font-size="14" fill="#bfdce5">Physical listening fixture</text></g>
<line x1="50" y1="664" x2="1350" y2="664" stroke="#41627a"/>
<text x="53" y="693" font-family="Arial,sans-serif" font-size="14" fill="#8ddcca">Solid arrows = PCM data / IRQ notifications</text>
<text x="53" y="719" font-family="Arial,sans-serif" font-size="14" fill="#c3baff">Dashed arrows = control events (not audio samples)</text>
<text x="720" y="693" font-family="Arial,sans-serif" font-size="14" fill="#b5c8d4">USB-C untethered R24 reported · battery protection and SPL not yet verified</text>
<text x="720" y="719" font-family="Arial,sans-serif" font-size="14" fill="#b5c8d4">Original KiCad unchanged · 2.667 ms / 128 samples at 48 kSa/s</text>
