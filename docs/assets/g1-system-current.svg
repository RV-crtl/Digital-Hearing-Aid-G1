<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 748" role="img" aria-labelledby="title desc">
<title id="title">G1 current custom-PCB hardware and FreeRTOS system architecture</title>
<desc id="desc">Data flow from PDM microphone, Bluetooth and LOW16 telecoil through DMA into FreeRTOS AudioTask and output. Touch and rotary controls enter through ControlTask and a bounded queue. R26 adaptive processing remains hardware-unverified.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#091926"/><stop offset="1" stop-color="#10263d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#7ddac7"/></marker><marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#b8b0f8"/></marker></defs>
<rect width="1400" height="748" rx="20" fill="url(#bg)"/>
<text x="50" y="56" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#f3fbff">G1 / THE COMPLETE SIGNAL PATH</text>
<text x="50" y="88" font-family="Arial,sans-serif" font-size="16" fill="#b1cfdd">Custom STM32L476RG PCB · FreeRTOS · working R24 interfaces / R26 adaptive candidate</text>
<text x="54" y="138" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#6bd8c6">INPUTS</text>
<text x="399" y="184" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#6bd8c6">CAPTURE + CONTROL</text>
<text x="743" y="227" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#6bd8c6">PROCESS</text>
<text x="1096" y="278" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#6bd8c6">OUTPUT</text>
<g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M320 206H354V240H397" stroke="#7ddac7" marker-end="url(#arrow)"/>
<path d="M320 315H375V265H397" stroke="#7ddac7" marker-end="url(#arrow)"/>
<path d="M320 424H355V316H397" stroke="#7ddac7" marker-end="url(#arrow)"/>
<path d="M320 554H397" stroke="#b8b0f8" stroke-dasharray="8 7" marker-end="url(#arrow2)"/>
<path d="M670 285H741" stroke="#7ddac7" marker-end="url(#arrow)"/>
<path d="M670 554H710V415H741" stroke="#b8b0f8" stroke-dasharray="8 7" marker-end="url(#arrow2)"/>
